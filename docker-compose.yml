services:
  db:
    image: postgres:15
    container_name: "database"
    ports:
      - '5441:5432'
    environment:
      - POSTGRES_USERNAME=postgres
      - POSTGRES_PASSWORD=postgres
      - POSTGRES_DATABASE=postgres
    volumes:
      - ./postgres-db:/var/lib/postgresql/data
  backend:
    image: ppo-backend
    container_name: "backend"
    ports:
      - '8081:8081'
      - '8082:8082'
    volumes:
      - ./backend/config.yml:/app/config.yml
      - ./backend/logs/:/app/logs/
    depends_on:
      - db
      - redis
  frontend:
    image: ppo-frontend
    container_name: frontend
    ports:
      - '8080:80'
    depends_on:
      - backend
    environment:
      - API_URL=http://localhost:8081/
  prometheus:
    image: prom/prometheus:latest
    container_name: prometheus
    ports:
      - "19090:9090"
    volumes:
      - ./backend/prometheus.yml:/etc/prometheus/prometheus.yml
  redis:
    image: redis:alpine
    restart: always
    container_name: redis
    ports:
      - "6379:6379"
    volumes:
      - ./backend/redis_data:/root/redis
      - ./backend/redis.conf:/usr/local/etc/redis/redis.conf
    environment:
      - REDIS_PASSWORD=redis
      - REDIS_PORT=6379
      - REDIS_DATABASES=16
    depends_on:
      - db

volumes:
  postgres-db:
    driver: local